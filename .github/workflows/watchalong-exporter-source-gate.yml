name: Watchalong exporter source gate
on:
  push:
    paths:
      - 'backend/today/d1/export-watchalong-events.py'
      - 'backend/today/d1/test_export_watchalong_events.py'
      - '.github/workflows/watchalong-exporter-source-gate.yml'
  pull_request:
    paths:
      - 'backend/today/d1/export-watchalong-events.py'
      - 'backend/today/d1/test_export_watchalong_events.py'
      - '.github/workflows/watchalong-exporter-source-gate.yml'
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s backend/today/d1 -p 'test_export_watchalong_events.py' -v
