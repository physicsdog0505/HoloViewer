name: Static Client UI preview boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and boundary checks
        run: |
          python -B -m py_compile preview_app.py
          python -B -m unittest -v test_preview_boundary
