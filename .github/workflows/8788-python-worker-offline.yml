name: 8788 Python Worker offline proof

on:
  push:
    branches:
      - dev/8788-full-4174
    paths:
      - 'platform_adapter/**'
      - 'tools/build_python_worker_bundle.py'
      - 'tools/package_8788_production_candidate.py'
      - 'test_package_8788_production_candidate.py'
      - 'tools/probe_python_worker_local.py'
      - 'tools/prepare_worker_fixture_bundle.py'
      - 'tools/probe_pyodide_combined_router.py'
      - 'tools/serve_8788_owner_api_mock.mjs'
      - 'tools/check_production_host_baseline.py'
      - 'test_*worker*.py'
      - 'test_public_api_binding.py'
      - 'test_playback_routes.py'
      - 'test_canonical_consumer_integration.py'
      - 'test_ptt_consumer_contract.py'
      - 'test_ptt_provider_binding.py'
      - 'test_8788_local_router_contract.py'
      - 'test_production_host_wiring.py'
      - 'tools/check_8788_local_router_contract.py'
      - 'tools/check_8788_owner_api_e2e.mjs'
      - '.github/workflows/8788-python-worker-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout current main for read-only production host baseline comparison
        uses: actions/checkout@v4
        with:
          ref: main
          path: .production-main
          persist-credentials: false
      - name: Checkout exact #47-owned existing API shell for read-only consumer E2E
        uses: actions/checkout@v4
        with:
          ref: 149a80361654b06377dbae580e1d8da2e5010cf0
          path: .owner-issue47
          persist-credentials: false
      - name: Checkout exact #48-owned PTT extension for combined read-only proof
        uses: actions/checkout@v4
        with:
          ref: b96d0902a504bc26019efd693a1b3586cfb3d3d2
          path: .owner-issue48
          persist-credentials: false
      - name: Verify proposed 8788 host diff against current main repo config
        run: |
          python3 tools/check_production_host_baseline.py \
            --main-root .production-main \
            --output "$RUNNER_TEMP/production-host-baseline-receipt.json"
      - name: Exercise exact #47 + #48 combined router into accepted consumer
        run: node tools/check_8788_owner_api_e2e.mjs .owner-issue47 .owner-issue48
      - name: Exercise exact #47 router via local mock D1 into accepted 4174 consumer
        run: node tools/check_8788_owner_api_e2e.mjs .owner-issue47
      - name: Verify immutable accepted 4174 snapshot
        run: python3 tools/verify_4174_snapshot.py
      - name: Run worker/provider offline regression
        run: |
          python3 -B -m unittest -v \
            test_public_api_binding \
            test_canonical_consumer_integration \
            test_ptt_consumer_contract \
            test_ptt_provider_binding \
            test_8788_local_router_contract \
            test_production_host_wiring \
            test_worker_preload \
            test_worker_preload_history \
            test_worker_transport \
            test_worker_transport_accepted \
            test_cloudflare_entry_binding \
            test_python_worker_bundle \
            test_package_8788_production_candidate
      - name: Package existing production Worker target (NO DEPLOY)
        run: |
          python3 tools/package_8788_production_candidate.py --output "$RUNNER_TEMP/holoviewer-public-candidate"
          test -f "$RUNNER_TEMP/holoviewer-public-candidate/wrangler.jsonc"
      - name: Build disposable manifest-pinned Worker bundle
        run: |
          python3 tools/build_python_worker_bundle.py --output "$RUNNER_TEMP/hv-8788-worker-bundle"
          test -f "$RUNNER_TEMP/hv-8788-worker-bundle/bundle-provenance.json"
      - name: Import exact accepted product from disposable Worker bundle
        run: |
          PYTHONPATH="$RUNNER_TEMP/hv-8788-worker-bundle" python3 -B -c "import client_app; import platform_adapter.worker_preload; print('PASS accepted product dependency import')"
          python3 -m compileall -q "$RUNNER_TEMP/hv-8788-worker-bundle"
      - uses: astral-sh/setup-uv@v6
      - name: Exercise actual local Python Worker/Pyodide runtime (no deploy)
        run: |
          python3 tools/probe_python_worker_local.py \
            --bundle "$RUNNER_TEMP/hv-8788-worker-bundle" \
            --output "$RUNNER_TEMP/python-worker-runtime-receipt.json"
      - name: Exercise single Pyodide fetch through exact #47+#48 Router into mock D1
        run: |
          python3 tools/build_python_worker_bundle.py --output "$RUNNER_TEMP/hv-8788-worker-router-e2e"
          python3 tools/probe_pyodide_combined_router.py \
            --bundle "$RUNNER_TEMP/hv-8788-worker-router-e2e" \
            --owner47 .owner-issue47 \
            --owner48 .owner-issue48 \
            --output "$RUNNER_TEMP/pyodide-combined-router-e2e.json"
      - name: Install Playwright Chromium for accepted geometry proof
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
      - name: Build disposable fixture-only accepted route proof
        run: |
          python3 tools/build_python_worker_bundle.py --output "$RUNNER_TEMP/hv-8788-worker-fixture"
          python3 tools/prepare_worker_fixture_bundle.py --bundle "$RUNNER_TEMP/hv-8788-worker-fixture"
          python3 tools/probe_python_worker_local.py \
            --bundle "$RUNNER_TEMP/hv-8788-worker-fixture" \
            --port 8788 \
            --output "$RUNNER_TEMP/python-worker-fixture-receipt.json"
      - name: Preserve local Pyodide probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8788-python-worker-local-proof
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/production-host-baseline-receipt.json
            ${{ runner.temp }}/python-worker-runtime-receipt.json
            ${{ runner.temp }}/python-worker-fixture-receipt.json
            ${{ runner.temp }}/pyodide-combined-router-e2e.json
            ${{ runner.temp }}/combined-router-e2e.log
            ${{ runner.temp }}/pyodide-combined-router-e2e.log
            ${{ runner.temp }}/worker-local-proof.log
