name: PTT #48 offline exact-head contract
on:
  pull_request:
    paths:
      - 'ptt_offline/**'
      - '.github/workflows/ptt48-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration SHA256 evidence (no cloud)
        run: python3 -B -m ptt_offline.migration_preflight
      - name: Cross-check reviewed Git blob identity
        run: |
          test "$(git hash-object ptt_offline/d1_migrations/0001_canonical_ptt.sql)" = "7466163e331b05c2b12ca559affbf2386f49460c"
      - name: All PTT offline Python regressions
        run: |
          python3 -B -m unittest -v \
            ptt_offline.test_public_today_contract \
            ptt_offline.test_consumer_boundary \
            ptt_offline.test_consumer_paging \
            ptt_offline.test_public_consumer_envelope \
            ptt_offline.test_d1_publisher \
            ptt_offline.test_d1_provider \
            ptt_offline.test_migration_preflight \
            ptt_offline.test_collector_source_preview
      - name: Cloudflare Worker pure offline regressions
        run: node --experimental-default-type=module --test ptt_offline/test_d1_worker_freshness.mjs
