name: PTT #48 offline exact-head contract
on:
  pull_request:
    paths:
      - 'ptt_offline/**'
      - '.github/workflows/ptt48-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration SHA256 evidence (no cloud)
        run: python3 -B -m ptt_offline.migration_preflight
      - name: Cross-check reviewed Git blob identity
        run: |
          test "$(git hash-object ptt_offline/d1_migrations/0001_canonical_ptt.sql)" = "7466163e331b05c2b12ca559affbf2386f49460c"
      - name: All PTT offline Python regressions
        run: |
          python3 -B -m unittest -v \
            ptt_offline.test_public_today_contract \
            ptt_offline.test_consumer_boundary \
            ptt_offline.test_consumer_paging \
            ptt_offline.test_public_consumer_envelope \
            ptt_offline.test_d1_publisher \
            ptt_offline.test_d1_provider \
            ptt_offline.test_migration_preflight \
            ptt_offline.test_collector_source_preview \
            ptt_offline.test_collector_integrity_export \
            ptt_offline.test_publisher_cli \
            ptt_offline.test_timestamp_authority \
            ptt_offline.test_resumable_publisher \
            ptt_offline.test_d1_transport_contract \
            ptt_offline.test_url_epoch_authority \
            ptt_offline.test_collector_day_stage \
            ptt_offline.test_publisher_session \
            ptt_offline.test_publisher_offline_e2e \
            ptt_offline.test_ptt_aid_identity \
            ptt_offline.test_source_time_partition \
            ptt_offline.test_verified_publisher_flow \
            ptt_offline.test_source_audit_stage \
            ptt_offline.test_owner_http_transport \
            ptt_offline.test_capacity_probe \
            ptt_offline.test_real_ptt_read_export \
            ptt_offline.test_owner_publisher_once \
            ptt_offline.test_realtime_capture_candidate \
            ptt_offline.test_live_capture_publisher \
            ptt_offline.test_recurring_publisher \
            ptt_offline.test_publisher_telemetry \
            ptt_offline.test_data_lifecycle_evidence \
            ptt_offline.test_data_lifecycle_bundle \
            ptt_offline.test_diagnose_current_day \
            ptt_offline.test_production_publisher_budget \
            ptt_offline.test_restart_production_publisher
      - name: Indexed PTT 1000-row capacity receipt (synthetic, offline only)
        run: python3 -B -m ptt_offline.capacity_probe
      - name: Cloudflare Worker pure offline regressions
        run: node --experimental-default-type=module --test ptt_offline/test_d1_worker_freshness.mjs ptt_offline/test_api_shell_ptt_extension.mjs ptt_offline/test_d1_owner_writer.mjs ptt_offline/test_d1_owner_dispatch.mjs ptt_offline/test_ptt_owner_hmac.mjs ptt_offline/test_api_owner_shell_extension.mjs ptt_offline/test_owner_ptt_migration_preflight.mjs ptt_offline/test_full_ptt_api_composition.mjs ptt_offline/test_actual_composed_host_ptt.mjs ptt_offline/test_worker_host.mjs ptt_offline/test_worker_host_build.mjs ptt_offline/worker_host/today/experience-read.test.mjs
