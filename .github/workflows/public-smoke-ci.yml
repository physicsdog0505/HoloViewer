name: Public smoke release review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'cloudflare/**'
      - 'test_public_smoke.py'
      - 'test_watchalong_assets.py'
      - 'scripts/export_watchalong_assets.py'
      - 'docs/handoffs/WATCHALONG_PUBLIC_ASSET_HANDOFF_20261020.md'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check compile and boundary tests
        run: |
          python -B -m py_compile app.py public_snapshot.py test_public_smoke.py test_watchalong_assets.py test_watchalong_viewer_adapter.py scripts/export_watchalong_assets.py
          python -B -m unittest -v test_public_smoke test_4174_ui_parity test_watchalong_assets test_watchalong_viewer_adapter
      - name: Static JS syntax and request policy
        run: |
          node --check site/assets/app.js
          node --check site/assets/config.js
          node --check site/assets/viewer-standalone.js
          node --check site/assets/ptt-today.js
          ! grep -E 'setTimeout|location.reload|eval\(|innerHTML|document.write\(' site/assets/app.js
          test "$(grep -o 'setInterval(' site/assets/app.js | wc -l | tr -d ' ')" = "2"
      - name: Dependency install and Streamlit boot
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8765 --browser.gatherUsageStats false > /tmp/holoviewer-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/_stcore/health | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/holoviewer-smoke.log
          exit 1
