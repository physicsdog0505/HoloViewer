name: Public smoke release review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'cloudflare/**'
      - 'test_public_smoke.py'
      - 'test_4174_ui_parity.py'
      - 'scripts/public_browser_lifecycle.mjs'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check compile and boundary tests
        run: |
          python -B -m py_compile app.py public_snapshot.py test_public_smoke.py
          python -B -m unittest -v test_public_smoke test_4174_ui_parity
      - name: Static JS syntax and request policy
        run: |
          node --check site/assets/app.js
          node --check site/assets/config.js
          node --check site/assets/viewer-standalone.js
          ! grep -E 'location.reload|eval\(|innerHTML|document.write\(' site/assets/app.js
          test "$(grep -o 'setTimeout(' site/assets/app.js | wc -l | tr -d ' ')" = "1"
          grep -F "pttPollTimer=setTimeout(async()=>{" site/assets/app.js
          grep -F "if(pttPollTimer)clearTimeout(pttPollTimer)" site/assets/app.js
          test "$(grep -o 'setInterval(' site/assets/app.js | wc -l | tr -d ' ')" = "2"
      - name: Real browser 4174 document-lifecycle acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          (
            cd cloudflare
            npx --yes wrangler@4.151.0 dev --local --port 8788 --config wrangler.json > /tmp/holoviewer-public-browser.log 2>&1
          ) &
          PUBLIC_PID=$!
          trap 'kill "$PUBLIC_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/ >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8788/ >/dev/null; then
            cat /tmp/holoviewer-public-browser.log
            exit 1
          fi
          HOLOVIEWER_TEST_BASE=http://127.0.0.1:8788 node scripts/public_browser_lifecycle.mjs
      - name: Dependency install and Streamlit boot
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8765 --browser.gatherUsageStats false > /tmp/holoviewer-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/_stcore/health | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/holoviewer-smoke.log
          exit 1
