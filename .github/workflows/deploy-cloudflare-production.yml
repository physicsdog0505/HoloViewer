name: HoloViewer production release evidence only

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character reviewed main commit SHA to validate (evidence only; no deploy)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin exactly reviewed main revision
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          test "${#REQUESTED_SHA}" -eq 40
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          test "${{ github.ref }}" = 'refs/heads/main'

      - name: Validate public static inputs
        run: |
          test -s site/index.html
          test -s site/assets/app.js
          test -s site/assets/config.js
          test -s site/viewer/index.html
          test -s site/watchalong-viewer/index.html
          test -s site/data/watchalong/manifest.json
          grep -F 'https://holoviewer-public-api.singlebagel.workers.dev' site/assets/config.js
          ! grep -R -E 'http://(localhost|127\.0\.0\.1)' site || exit 1

      - name: Validate release safety contracts
        run: |
          node --check site/assets/app.js
          node --check site/assets/config.js
          node --check site/assets/viewer-standalone.js
          node --check site/assets/watchalong-standalone.js
          python -B -m unittest -v             test_public_smoke             test_4174_ui_parity             test_frontend_release_gate

      - name: Confirm evidence-only policy
        run: |
          echo "PRODUCTION_MUTATION=NO"
          echo "OWNER_LOCAL_DEPLOY_REQUIRED=YES"
          echo "GITHUB_ACTIONS_DEPLOY_DISABLED=YES"
