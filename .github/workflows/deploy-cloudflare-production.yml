name: Deploy HoloViewer Cloudflare production
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to update holoviewer-public production Worker"
        required: true
        type: string
      release_sha:
        description: "Full 40-character reviewed main commit SHA (must equal checked-out commit)"
        required: true
        type: string
      baseline_confirmed:
        description: "Type BASELINE-CHECKED after reviewing current Cloudflare Worker configuration and rollback"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: holoviewer-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY' && inputs.baseline_confirmed == 'BASELINE-CHECKED'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin exactly reviewed production revision
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          test "${#REQUESTED_SHA}" -eq 40
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          test "${{ github.ref }}" = 'refs/heads/main'
      - name: Verify production asset inputs
        run: |
          test -s site/index.html
          test -s site/assets/app.js
          test -s site/assets/app.css
          test -s site/assets/config.js
          test -s site/viewer/index.html
          test -s site/assets/viewer-standalone.js
          test -s site/assets/viewer-standalone.css
          grep -F 'https://holoviewer-public-api.singlebagel.workers.dev' site/assets/config.js
          ! grep -R -E 'http://(localhost|127\.0\.0\.1)' site || exit 1
      - name: Validate public client JavaScript and request policy
        run: |
          node --check site/assets/app.js
          node --check site/assets/config.js
          node --check site/assets/viewer-standalone.js
          ! grep -E 'setTimeout|location.reload|eval\(|innerHTML|document.write\(' site/assets/app.js
          test "$(grep -o 'setInterval(' site/assets/app.js | wc -l | tr -d ' ')" = "2"
          python -B -m unittest -v test_public_smoke test_4174_ui_parity
      - name: Validate Wrangler static assets config (no script, D1, KV or routes)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('cloudflare/wrangler.json').read_text())
          assert set(cfg)=={'name','compatibility_date','assets'}, cfg.keys()
          assert cfg['name']=='holoviewer-public'
          assert cfg['assets']=={'directory':'../site','not_found_handling':'single-page-application'}
          assert 'main' not in cfg
          PY
      - name: Deploy static assets to existing production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
