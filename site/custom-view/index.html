<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自訂觀看 · HoloViewer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d10;color:#f5f7fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0d10}
header{height:56px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid #242830;background:#111419}
header a{color:#f5f7fa;text-decoration:none;font-weight:700}
header span{color:#aeb6c2}
main{width:min(1100px,calc(100% - 32px));margin:40px auto}
h1{margin:0 0 8px;font-size:30px}
p{color:#aeb6c2;margin:0 0 24px}
form{display:flex;gap:10px;margin-bottom:18px}
input{flex:1;min-width:0;padding:13px 14px;border:1px solid #343a46;border-radius:8px;background:#151920;color:#fff;font:inherit}
button{padding:12px 18px;border:0;border-radius:8px;background:#f5f7fa;color:#111;font:inherit;font-weight:700;cursor:pointer}
#error{min-height:22px;color:#ff9d9d;margin-bottom:12px}
#player-shell{display:none}
#player-shell.active{display:block}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:640px){main{margin:24px auto}form{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<header><a href="/">HoloViewer</a><span>自訂觀看</span></header>
<main>
<h1>自訂觀看</h1>
<p>貼上 YouTube 網址，直接開啟播放器。</p>
<form id="open-form">
<input id="youtube-url" type="text" inputmode="url" autocomplete="off" aria-label="YouTube URL 或 Video ID" placeholder="YouTube URL 或 Video ID" autofocus>
<button type="submit">開啟</button>
</form>
<div id="error" role="alert"></div>
<section id="player-shell">
<div class="player" id="player"></div>
</section>
</main>
<script>
'use strict';
function videoId(value){
  const raw=String(value||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(raw))return raw;
  try{
    const u=new URL(raw);
    if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtu.be'].includes(u.hostname))return null;
    let id=null;
    if(u.hostname.includes('youtu.be'))id=u.pathname.split('/')[1];
    else if(u.pathname==='/watch')id=u.searchParams.get('v');
    else{
      const parts=u.pathname.split('/').filter(Boolean);
      if(['live','embed','shorts'].includes(parts[0]))id=parts[1];
    }
    return /^[A-Za-z0-9_-]{11}$/.test(id||'')?id:null;
  }catch{return null}
}
const form=document.getElementById('open-form');
const input=document.getElementById('youtube-url');
const error=document.getElementById('error');
const shell=document.getElementById('player-shell');
const player=document.getElementById('player');
form.addEventListener('submit',event=>{
  event.preventDefault();
  const id=videoId(input.value);
  if(!id){error.textContent='請貼上有效的 YouTube 網址或 Video ID。';return}
  error.textContent='';
  const iframe=document.createElement('iframe');
  const src=new URL('https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id));
  if(/^https?:$/.test(location.protocol))src.searchParams.set('origin',location.origin);
  iframe.src=src.toString();
  iframe.title='YouTube player';
  iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  iframe.referrerPolicy='strict-origin-when-cross-origin';
  iframe.allowFullscreen=true;
  player.replaceChildren(iframe);
  shell.classList.add('active');
});
</script>
</body>
</html>
