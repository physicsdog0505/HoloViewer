<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自訂觀看 · HoloDocchi</title>
<link rel="stylesheet" href="/assets/shared-shell.css">
<link rel="stylesheet" href="/assets/viewer-standalone.css">
<link rel="stylesheet" href="/assets/ptt-links.css">
</head>
<body>
<aside class="client-rail" aria-label="主要功能">
  <a class="rail-brand" href="/" aria-label="HoloDocchi 首頁"><span class="rail-icon">H</span><span class="rail-label">HoloDocchi</span></a>
  <nav class="rail-nav">
    <a href="/"><span class="rail-icon">今</span><span class="rail-label">今日直播</span></a>
    <a href="/history"><span class="rail-icon">史</span><span class="rail-label">歷史直播</span></a>
    <a href="/watchalong"><span class="rail-icon">視</span><span class="rail-label">同時視聽</span></a>
    <a href="/custom-view" class="active" aria-current="page"><span class="rail-icon">自</span><span class="rail-label">自訂觀看</span></a>
    <a href="/collab"><span class="rail-icon" aria-hidden="true"></span><span class="rail-label">多人連動</span></a>
    <a href="/ptt-today/"><span class="rail-icon">PTT</span><span class="rail-label">PTT 今日專串</span></a>
  </nav>
</aside>
<nav class="mobile-bottom-dock" aria-label="手機主要功能">
  <a data-mobile-dock-route="home" href="/" aria-label="今日直播">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10.5V20h13v-9.5M9.5 20v-5h5v5"/></svg>
  </a>
  <a data-mobile-dock-route="history" href="/history" aria-label="歷史直播">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
  </a>
  <a data-mobile-dock-route="multi" href="/collab" aria-label="多人連動">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="2.7"/><circle cx="16" cy="8" r="2.7"/><path d="M3.5 19c.4-3 1.9-4.7 4.5-4.7s4.1 1.7 4.5 4.7M11.5 19c.4-3 1.9-4.7 4.5-4.7s4.1 1.7 4.5 4.7"/></svg>
  </a>
  <a data-mobile-dock-route="ptt" href="/ptt-today/" aria-label="PTT 今日專串"><span>PTT</span></a>
</nav>

<aside id="viewerLiveRail" class="viewer-live-rail" aria-label="目前直播頻道" hidden>
  <span class="viewer-live-label">直播中</span>
  <div id="viewerLiveList"></div>
</aside>

<div class="viewer-shell">
  <header class="viewer-topbar">
    <div class="viewer-mode-switch" role="group" aria-label="觀看模式">
      <span>單人</span>
      <label class="mode-switch">
        <input id="multiModeSwitch" type="checkbox" aria-label="切換單人或多人模式">
        <span class="mode-switch-track" aria-hidden="true"></span>
      </label>
      <span>多人</span>
    </div>

    <div id="persistentPlaybackControls" class="persistent-playback-controls" hidden>
      <label class="control-toggle compact-toggle" title="任一視角播放或暫停時，其餘視角跟著同步">
        <input id="syncPlayback" type="checkbox" checked>
        <span class="toggle-ui" aria-hidden="true"></span>
        <span>連動播放</span>
      </label>
      <button id="playAll" class="transport-button" type="button" aria-label="全部播放" title="全部播放">▶</button>
      <button id="pauseAll" class="transport-button" type="button" aria-label="全部暫停" title="全部暫停">Ⅱ</button>
    </div>

    <section id="viewerControls" class="viewer-controls" hidden>
      <div class="layout-segment" id="layoutGroup" role="group" aria-label="觀看版型">
        <button type="button" data-layout-preset="equal" aria-pressed="false">預設</button>
        <button type="button" data-layout-preset="primary" aria-pressed="false">輪播</button>
      </div>
      <div class="control-group" id="focusGroup">
        <div id="focusChoices" class="choice-row" aria-label="選擇主視角"></div>
        <span id="focusCarouselStatus" class="focus-carousel-status" hidden></span>
      </div>
      <label class="control-toggle" id="carouselControl" title="輪播自動啟用" hidden>
        <input id="focusCarousel" type="checkbox">
        <span class="toggle-ui" aria-hidden="true"></span>
        <span>輪播</span>
      </label>
      <label class="carousel-interval" id="carouselIntervalGroup" hidden>
        <input id="focusCarouselInterval" type="range" min="30" max="60" step="5" value="30" aria-label="輪播間隔秒數">
        <output id="focusCarouselIntervalOutput">30s</output>
      </label>
    </section>

    <div class="viewer-watch-actions">
      <details id="viewerLocalSubtitlePanel" class="viewer-local-subtitle-panel">
        <summary>字幕 A/B</summary>
        <div class="viewer-local-subtitle-body">
          <div class="viewer-local-subtitle-source" role="group" aria-label="字幕來源">
            <button type="button" data-viewer-local-subtitle-mode="holodocchi" class="active" aria-pressed="true">Holodocchi</button>
            <button type="button" data-viewer-local-subtitle-mode="A" aria-pressed="false" disabled>A</button>
            <button type="button" data-viewer-local-subtitle-mode="B" aria-pressed="false" disabled>B</button>
            <button type="button" data-viewer-local-subtitle-mode="A-B" aria-pressed="false" disabled>A-B</button>
          </div>
          <div class="viewer-local-subtitle-slot">
            <strong>A</strong>
            <label class="viewer-local-subtitle-file">載入檔案<input id="viewerLocalSubtitleFileA" type="file" accept=".srt,.vtt,.json,text/vtt,application/json" hidden></label>
            <span id="viewerLocalSubtitleNameA">未載入</span>
            <button id="viewerLocalSubtitleClearA" type="button" disabled>清除</button>
          </div>
          <div class="viewer-local-subtitle-slot">
            <strong>B</strong>
            <label class="viewer-local-subtitle-file">載入檔案<input id="viewerLocalSubtitleFileB" type="file" accept=".srt,.vtt,.json,text/vtt,application/json" hidden></label>
            <span id="viewerLocalSubtitleNameB">未載入</span>
            <button id="viewerLocalSubtitleClearB" type="button" disabled>清除</button>
          </div>
          <label class="viewer-local-subtitle-size">字幕大小
            <input id="viewerLocalSubtitleFontSize" type="range" min="18" max="40" step="1" value="28" aria-label="字幕大小">
            <output id="viewerLocalSubtitleFontValue" for="viewerLocalSubtitleFontSize">28px</output>
          </label>
          <output id="viewerLocalSubtitleStatus" class="viewer-local-subtitle-status" aria-live="polite"></output>
          <small>只套用目前主視角；字幕檔只在目前頁面使用，不上傳、不保存。</small>
        </div>
      </details>
      <button id="viewerCallMode" type="button" aria-pressed="false" title="關閉打 Call 模式" hidden>Call ✓</button>
      <button id="viewerSettings" type="button" aria-expanded="false">觀看設定</button>
      <button id="viewerFullscreen" type="button">沉浸模式</button>
    </div>
  </header>

  <main class="viewer-main">
    <section class="viewer-workspace">
      <div id="stage" class="viewer-stage"></div>
      <aside id="pttPanel" class="viewer-ptt ptt-floor-hidden" hidden>
        <div class="ptt-heading">
          <div class="ptt-title-line">
            <strong id="pttTitle">PTT 專串</strong>
            <label class="ptt-floor-control" title="顯示或隱藏樓數">
              <input id="pttShowFloor" type="checkbox">
              <span class="ptt-floor-check" aria-hidden="true"></span>
              <span>樓數</span>
            </label>
            <small id="pttMeta" class="ptt-meta-sr" aria-live="polite">讀取中</small>
          </div>
          <label class="ptt-font-control">字體
            <input id="pttFontSize" type="range" min="12" max="26" step="1" value="14">
            <output id="pttFontValue">14px</output>
          </label>
        </div>
        <div id="pttFeed" class="ptt-feed"></div>
        <button id="pttNewest" class="ptt-newest" type="button" hidden>最新</button>
      </aside>
    </section>
  </main>
</div>

<script src="/assets/config.js"></script>
<script src="/assets/local-subtitle-core.js"></script>
<script src="/assets/vod-subtitle-core.js"></script>
<script src="/assets/ptt-links.js"></script>
<script src="/assets/video-metadata-resolver.js"></script>
<script src="/assets/viewing-timeline-core.js"></script>
<script src="/assets/viewing-timeline-viewer-adapter.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="/assets/viewer-standalone.js" defer></script>
</body>
</html>
