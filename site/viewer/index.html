<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer · HoloViewer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080a0d;color:#f5f7fa}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0d}body{min-height:100vh}
header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #242830;background:#101318}
header strong{font-size:14px}header span{font-size:12px;color:#9ea7b4}
main{padding:12px;height:calc(100vh - 48px)}
.grid{display:grid;gap:10px;width:100%;height:100%}
.grid.one{grid-template-columns:1fr}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.grid.three .player:first-child{grid-row:1 / 3}
.player{position:relative;min-width:0;min-height:0;background:#000;border:1px solid #252a33;border-radius:8px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{display:grid;place-items:center;height:100%;color:#aeb6c2}
@media(max-width:760px){main{height:auto}.grid,.grid.two,.grid.three{grid-template-columns:1fr;grid-template-rows:none}.grid.three .player:first-child{grid-row:auto}.player{aspect-ratio:16/9}}
</style>
</head>
<body>
<header><strong>HoloViewer · Viewer</strong><span>獨立播放器</span></header>
<main><div id="grid" class="grid"></div></main>
<script>
'use strict';
const params=new URLSearchParams(location.search);
const ids=[...new Set(params.getAll('stream').filter(id=>/^[A-Za-z0-9_-]{11}$/.test(id)))].slice(0,3);
const grid=document.getElementById('grid');
if(!ids.length){
  const empty=document.createElement('div');empty.className='empty';empty.textContent='沒有可播放的 YouTube 影片。';grid.append(empty);
}else{
  grid.classList.add(ids.length===1?'one':ids.length===2?'two':'three');
  ids.forEach((id,index)=>{
    const shell=document.createElement('section');shell.className='player';
    const frame=document.createElement('iframe');
    const src=new URL('https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id));
    src.searchParams.set('enablejsapi','1');
    if(/^https?:$/.test(location.protocol))src.searchParams.set('origin',location.origin);
    frame.src=src.toString();frame.title='YouTube player '+(index+1);
    frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    frame.referrerPolicy='strict-origin-when-cross-origin';frame.allowFullscreen=true;
    shell.append(frame);grid.append(shell);
  });
}
</script>
</body>
</html>
