<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoloViewer</title><link rel="stylesheet" href="assets/app.css"></head>
<body><div class="shell">
<aside class="nav client-rail" aria-label="4174 導覽">
 <div class="brand rail-brand"><span class="rail-icon">H</span><span class="rail-label">HoloViewer</span></div>
 <nav class="rail-nav">
 <button data-route="home" class="active"><span class="rail-icon">今</span><span class="rail-label">今日直播</span></button>
 <button data-route="history"><span class="rail-icon">史</span><span class="rail-label">歷史直播</span></button>
 <button data-route="watchalong"><span class="rail-icon">視</span><span class="rail-label">同時視聽</span></button>
 <button data-route="single"><span class="rail-icon">自</span><span class="rail-label">自訂觀看</span></button>
 <button data-route="multi"><span class="rail-icon">👥</span><span class="rail-label">多人連動</span></button>
 <button data-route="ptt"><span class="rail-icon">PTT</span><span class="rail-label">PTT 今日專串</span></button>

 </nav></aside>
 <div class="app-content"><header class="client-topbar"><button id="menu" aria-label="切換選單">☰</button><span id="page-title" class="top-status">今日直播</span><span id="connection" class="connection-status">連線確認中</span></header>
 <main class="client-main">
 <section id="home" class="page active"><div class="page-head"><div><h1>今日直播</h1><p>即時直播、預定與已結束的影片</p></div></div><div id="catalog" class="cards client-grid"></div></section>
 <section id="single" class="page"><div class="page-head"><div><h1>自訂觀看</h1><p>使用 YouTube 影片網址加入觀看</p></div></div><div class="entry"><input id="single-url" aria-label="YouTube 影片網址" placeholder="YouTube 網址或影片 ID"><button id="single-add">播放</button></div><div id="single-player" class="player-area"></div></section>
 <section id="multi" class="page"><div class="page-head"><div><h1>多人連動</h1><p>現階段手動加入；4174 的自動 POV 偵測尚未移植</p></div></div><div class="entry"><input id="multi-url" aria-label="多人觀看影片網址" placeholder="YouTube 網址或影片 ID"><button id="multi-add">加入畫面</button><button id="multi-clear" class="secondary">清空</button></div><div id="multi-players" class="multi-grid"></div></section>
 <section id="history" class="page"><div class="page-head"><div><h1>歷史直播</h1><p>依台灣日期查詢已完成影片</p></div></div><div class="entry"><input type="date" id="history-day" aria-label="History 日期"><button id="history-load">查詢</button></div><p id="history-status" class="sub"></p><div id="history-list" class="cards client-grid"></div><div class="entry"><button id="history-prev" class="secondary">上一頁</button><button id="history-next" class="secondary">下一頁</button></div></section>
 <section id="ptt" class="page"><div class="page-head"><div><h1>PTT 今日專串</h1><p>即時專串與歷史推文</p></div></div><div id="ptt-status"></div><div id="ptt-list" class="pushes"></div></section>
 <section id="watchalong" class="page"><div class="page-head"><div><h1>同時視聽</h1><p>影片與推文同步觀看</p></div></div><div class="entry"><input id="watch-url" aria-label="同時視聽影片網址" placeholder="YouTube 影片網址或 ID"><button id="watch-add">開啟影片</button></div><div id="watch-player" class="player-area"></div><div id="watch-status" class="notice">PTT 時間對齊、Playlist、A/B 字幕仍待正式 API 接線，不顯示偽造資料。</div></section>
 <footer>非官方粉絲專案 · 與 COVER Corp.、YouTube 無從屬關係</footer></main></div></div>
 <script src="assets/config.js"></script><script src="assets/app.js"></script></body></html>
