<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTT 今日專串 · HoloDocchi</title>
<link rel="stylesheet" href="/assets/shared-shell.css">
<link rel="stylesheet" href="/assets/ptt-today.css">
</head>
<body>
<aside class="client-rail" aria-label="主要功能">
  <a class="rail-brand" href="/" aria-label="HoloDocchi 首頁"><span class="rail-icon">H</span><span class="rail-label">HoloDocchi</span></a>
  <nav class="rail-nav">
    <a href="/"><span class="rail-icon">今</span><span class="rail-label">今日直播</span></a>
    <a href="/history"><span class="rail-icon">史</span><span class="rail-label">歷史直播</span></a>
    <a href="/watchalong"><span class="rail-icon">視</span><span class="rail-label">同時視聽</span></a>
    <a href="/custom-view"><span class="rail-icon">自</span><span class="rail-label">自訂觀看</span></a>
    <a href="/collab"><span class="rail-icon">👥</span><span class="rail-label">多人連動</span></a>
    <a href="/ptt-today/" class="active" aria-current="page"><span class="rail-icon">PTT</span><span class="rail-label">PTT 今日專串</span></a>
  </nav>
</aside>
<nav class="mobile-bottom-dock" aria-label="手機主要功能">
  <a data-mobile-dock-route="home" href="/" aria-label="今日直播">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10.5V20h13v-9.5M9.5 20v-5h5v5"/></svg>
  </a>
  <a data-mobile-dock-route="history" href="/history" aria-label="歷史直播">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
  </a>
  <a data-mobile-dock-route="multi" href="/collab" aria-label="多人連動">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="2.7"/><circle cx="16" cy="8" r="2.7"/><path d="M3.5 19c.4-3 1.9-4.7 4.5-4.7s4.1 1.7 4.5 4.7M11.5 19c.4-3 1.9-4.7 4.5-4.7s4.1 1.7 4.5 4.7"/></svg>
  </a>
  <a data-mobile-dock-route="ptt" href="/ptt-today/" class="active" aria-current="page" aria-label="PTT 今日專串"><span>PTT</span></a>
</nav>

<header class="client-topbar">
  <button id="mobileNavButton" class="mobile-nav-button" type="button" aria-expanded="false" aria-controls="mobileNav" aria-label="開啟導覽">☰</button>
  <a class="mobile-top-brand" href="/">HoloDocchi</a>
  <div id="page-title" class="top-status"></div>
</header>

<div id="mobileNav" class="mobile-nav" hidden>
  <a href="/">今日直播</a>
  <a href="/history">歷史直播</a>
  <a href="/watchalong">同時視聽</a>
  <a href="/custom-view">自訂觀看</a>
  <a href="/collab">多人連動</a>
  <a href="/ptt-today/" class="active" aria-current="page">PTT 今日專串</a>
</div>

<main class="client-main">
  <div class="ptt-shell">
    <div class="page-head"><div><h1>PTT 今日專串</h1></div></div>
    <div class="ptt-toolbar">
      <div class="ptt-meta" id="ptt-today-meta">讀取今日專串資訊中 · 純 PTT 閱讀</div>
      <div class="ptt-actions">
        <label id="ptt-floor-toggle" hidden><input id="ptt-show-floor" type="checkbox" checked> 樓數</label>
        <button class="subtle-action" id="ptt-refresh" type="button" aria-label="重新整理今日專串">↻ 重新整理</button>
        <button class="subtle-action" id="ptt-focus" type="button" aria-label="進入專注模式">⛶ 專注模式</button>
      </div>
    </div>
    <section class="ptt-reader">
      <button id="ptt-reader-action" class="ptt-reader-action" type="button" aria-label="進入專注模式" title="短按：專注模式；長按：開啟 PTT 原始專串">⛶</button>
      <div id="ptt-empty" class="ptt-empty">目前尚未接通經過驗證的公開 PTT 專串資料。</div>
      <div id="ptt-list" class="pushes" hidden></div>
      <button id="ptt-newest" type="button" hidden>最新</button>
    </section>
  </div>
</main>

<script src="/assets/config.js"></script>
<script src="/assets/ptt-today.js" defer></script>
</body>
</html>
