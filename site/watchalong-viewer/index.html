<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同時視聽 · HoloDocchi</title>
<link rel="stylesheet" href="/assets/shared-shell.css">
<link rel="stylesheet" href="/assets/watchalong-standalone.css">
<link rel="stylesheet" href="/assets/ptt-links.css">
</head>
<body>
<div id="immersiveToolbarTrigger" class="immersive-toolbar-trigger" aria-hidden="true"></div>
<aside class="client-rail" aria-label="主要功能">
  <a class="rail-brand" href="/" aria-label="HoloDocchi 首頁"><span class="rail-icon">H</span><span class="rail-label">HoloDocchi</span></a>
  <nav class="rail-nav">
    <a href="/"><span class="rail-icon">今</span><span class="rail-label">今日直播</span></a>
    <a href="/history"><span class="rail-icon">史</span><span class="rail-label">歷史直播</span></a>
    <a href="/watchalong" class="active" aria-current="page"><span class="rail-icon">視</span><span class="rail-label">同時視聽</span></a>
    <a href="/custom-view"><span class="rail-icon">自</span><span class="rail-label">自訂觀看</span></a>
    <a href="/collab"><span class="rail-icon">👥</span><span class="rail-label">多人連動</span></a>
    <a href="/ptt-today/"><span class="rail-icon">PTT</span><span class="rail-label">PTT 今日專串</span></a>
  </nav>
</aside>

<button id="mobileControlsToggle" class="mobile-controls-toggle" type="button" aria-expanded="false" aria-controls="mobileControlsPanel">⋯</button>
<div id="mobileControlsPanel" class="mobile-controls-panel" hidden>
  <div class="mobile-controls-head">
    <strong>同時視聽控制</strong>
    <button id="mobileControlsClose" type="button" aria-label="關閉控制">×</button>
  </div>
  <div class="mobile-controls-grid">
    <button id="mobilePrimarySource" type="button">動畫主畫面</button>
    <button id="mobilePrimaryHost" type="button">Hololive 主畫面</button>
    <button id="mobileLinkedPlayback" type="button">連動播放：開</button>
    <button id="mobileStartSync" type="button" class="mobile-sync-start">開始同步播放</button>
    <button id="mobileAlignNow" type="button">對齊目前位置</button>
    <button id="mobilePrevSegment" type="button">上一集</button>
    <button id="mobileNextSegment" type="button">下一集</button>
    <button id="mobileSubtitleMode" type="button">字幕：一般</button>
    <a href="/watchalong" class="mobile-control-link">返回選擇</a>
    <button id="mobileFullscreen" type="button">沉浸模式</button>
  </div>
</div>

<div class="watchalong-shell">
  <header class="watchalong-topbar">
    <div class="layout-segment" role="group" aria-label="同時視聽版型">
      <button type="button" data-watch-layout="equal" class="active" aria-pressed="true">並排</button>
      <button type="button" data-watch-layout="source" aria-pressed="false">動畫優先</button>
    </div>
    <label class="control-toggle" title="Hololive 播放、暫停與跳轉時讓片源跟著同步">
      <input id="linkedPlayback" type="checkbox" checked>
      <span class="toggle-ui" aria-hidden="true"></span>
      <span>連動播放</span>
    </label>
    <div class="sync-controls">
      <button id="offsetMinus" type="button" title="片源提早 1 秒" disabled>−1s</button>
      <output id="offsetValue">尚未對齊</output>
      <button id="offsetPlus" type="button" title="片源延後 1 秒" disabled>+1s</button>
      <button id="captureOffset" type="button">對齊目前位置</button>
    </div>
    <div class="segment-controls" role="group" aria-label="段點切換">
      <button id="previousSegment" type="button" disabled>上一集</button>
      <output id="segmentStatus">無段點</output>
      <button id="nextSegment" type="button" disabled>下一集</button>
    </div>
    <div class="subtitle-mode-controls" role="group" aria-label="字幕顯示模式">
      <button type="button" data-subtitle-mode="standard" class="active" aria-pressed="true">字幕</button>
      <button type="button" data-subtitle-mode="danmaku" class="active" aria-pressed="true">彈幕</button>
      <button type="button" data-subtitle-mode="off" aria-pressed="false">關閉</button>
    </div>
    <details id="localSubtitlePanel" class="local-subtitle-panel">
      <summary>字幕 A/B</summary>
      <div class="local-subtitle-body">
        <div class="local-subtitle-source" role="group" aria-label="字幕來源">
          <button type="button" data-local-subtitle-mode="holodocchi" class="active" aria-pressed="true">Holodocchi</button>
          <button type="button" data-local-subtitle-mode="A" aria-pressed="false" disabled>A</button>
          <button type="button" data-local-subtitle-mode="B" aria-pressed="false" disabled>B</button>
          <button type="button" data-local-subtitle-mode="A-B" aria-pressed="false" disabled>A-B</button>
        </div>
        <div class="local-subtitle-slot">
          <strong>A</strong>
          <label class="local-subtitle-file-button">載入檔案<input id="localSubtitleFileA" type="file" accept=".srt,.vtt,.json,text/vtt,application/json" hidden></label>
          <span id="localSubtitleNameA">未載入</span>
          <button id="localSubtitleClearA" type="button" disabled>清除</button>
        </div>
        <div class="local-subtitle-slot">
          <strong>B</strong>
          <label class="local-subtitle-file-button">載入檔案<input id="localSubtitleFileB" type="file" accept=".srt,.vtt,.json,text/vtt,application/json" hidden></label>
          <span id="localSubtitleNameB">未載入</span>
          <button id="localSubtitleClearB" type="button" disabled>清除</button>
        </div>
        <label class="local-subtitle-size">字幕大小
          <input id="localSubtitleFontSize" type="range" min="18" max="40" step="1" value="28" aria-label="字幕大小">
          <output id="localSubtitleFontValue" for="localSubtitleFontSize">28px</output>
        </label>
        <output id="localSubtitleStatus" class="local-subtitle-status" aria-live="polite"></output>
        <small>本機字幕只在目前瀏覽器頁面使用，不上傳、不保存。</small>
      </div>
    </details>
    <div class="watchalong-actions">
      <output id="resumeStatus" class="resume-status" aria-live="polite"></output>
      <a href="/watchalong" class="watchalong-link">返回選擇</a>
      <button id="fullscreen" type="button">沉浸模式</button>
    </div>
  </header>

  <main class="watchalong-main">
    <section id="watchalongWorkspace" class="watchalong-workspace layout-equal mobile-primary-source">
      <section class="host-stack">
        <article class="video-card host-card">
          <div class="video-label"><strong>Hololive</strong><span id="hostStatus">判定中</span></div>
          <button id="mobileSwapHost" class="mobile-swap-button" type="button" aria-label="將 Hololive 切到主畫面">切到主畫面</button>
          <div id="hostPlayer" class="player-host"></div>
        </article>
        <div class="host-volume-control" aria-label="Hololive 音量">
          <span class="host-volume-label">Hololive 音量</span>
          <button id="hostMuteToggle" type="button" aria-label="切換 Hololive 靜音" title="切換 Hololive 靜音">音</button>
          <input id="hostVolume" type="range" min="0" max="100" step="1" value="100" aria-label="Hololive 音量">
          <output id="hostVolumeValue" for="hostVolume">100%</output>
        </div>
        <div id="subtitleOverlay" class="subtitle-overlay" hidden>
          <div id="subtitleTranslation" class="subtitle-line translation"></div>
          <div id="subtitleComparison" class="subtitle-comparison" hidden>
            <div><strong>A</strong><span id="subtitleTranslationA"></span></div>
            <div><strong>B</strong><span id="subtitleTranslationB"></span></div>
          </div>
        </div>
        <aside id="pttPanel" class="watchalong-ptt ptt-floor-hidden">
          <div class="ptt-heading">
            <strong id="pttTitle">PTT 專串</strong>
            <label class="ptt-floor-control"><input id="pttShowFloor" type="checkbox"><span>樓數</span></label>
            <label class="ptt-font-control">字體
              <input id="pttFontSize" type="range" min="12" max="26" step="1" value="14">
              <output id="pttFontValue">14px</output>
            </label>
            <small id="pttMeta">讀取中</small>
          </div>
          <div id="pttFeed" class="ptt-feed"></div>
          <button id="pttNewest" class="ptt-newest" type="button" hidden>最新</button>
        </aside>
      </section>

      <section class="source-stack">
        <article class="video-card source-card">
          <div class="video-label"><strong id="sourceLabel">同步片源</strong><span id="sourceStatus"></span></div>
          <button id="mobileSwapSource" class="mobile-swap-button" type="button" aria-label="將同步片源切到主畫面">切到主畫面</button>
          <div id="sourcePlayer" class="player-host"></div>
          <div id="sourceStandby" class="source-standby" hidden>
            <strong>等待同步片源</strong>
            <span>主影片尚未進入這段片源的對齊時間</span>
          </div>
          <div id="sourceSubtitleOverlay" class="source-subtitle-overlay" hidden>
            <div id="sourceSubtitleTranslation" class="subtitle-line translation"></div>
            <div id="sourceSubtitleComparison" class="subtitle-comparison" hidden>
              <div><strong>A</strong><span id="sourceSubtitleTranslationA"></span></div>
              <div><strong>B</strong><span id="sourceSubtitleTranslationB"></span></div>
            </div>
          </div>
          <div id="danmakuLayer" class="danmaku-layer" aria-live="off"></div>
        </article>

      </section>
    </section>
  </main>
</div>

<script src="/assets/config.js"></script>
<script src="/assets/ptt-links.js"></script>
<script src="/assets/video-metadata-resolver.js"></script>
<script src="/assets/watchalong-static-core.js"></script>
<script src="/assets/local-subtitle-core.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="/assets/watchalong-standalone.js" defer></script>
</body>
</html>
