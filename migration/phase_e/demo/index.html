<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>HoloViewer 8788 — Phase E</title>
<link rel="stylesheet" href="./shell.css">
</head>
<body>
<aside class="client-rail" aria-label="主導覽">
  <strong class="rail-brand">HoloViewer <small>8788</small></strong>
  <nav>
    <a href="#home" data-route="home">今日直播</a>
    <a href="#history" data-route="history">歷史直播</a>
    <a href="#custom" data-route="custom">自訂觀看</a>
    <a href="#session" data-route="session">觀看畫面</a>
    <a href="#ptt" data-route="ptt">PTT 今日專串</a>
    <a href="#watchalong" data-route="watchalong">同時視聽</a>
    <a href="#collab" data-route="collab">多人連動</a>
  </nav>
</aside>
<main class="client-main">
  <header class="page-head">
    <div><h1 id="page-title">今日直播</h1><p id="page-note">Phase E 隔離開發版；資料僅由正式唯讀 API 取得</p></div>
    <span id="api-status" role="status"></span>
  </header>
  <section class="page" id="home">
    <div class="section-head"><h2>今日直播</h2><button type="button" id="refresh-today">更新</button></div>
    <div id="today-buckets" class="content-stack"></div>
  </section>
  <section class="page" id="history" hidden>
    <div class="section-head"><h2>歷史直播</h2><div class="controls">
      <input id="history-day" type="date" aria-label="歷史日期">
      <button id="history-search" type="button">查詢</button>
    </div></div>
    <div id="history-rows" class="card-grid"></div>
    <div class="controls"><button type="button" id="history-prev">上一頁</button><button type="button" id="history-next">下一頁</button></div>
  </section>
  <section class="page" id="custom" hidden>
    <p>自行挑選任意 YouTube 影片組合，調整排序及主視角。未經驗證的影片不會被推定為同場直播。</p>
    <div class="custom-layout">
      <div class="custom-main">
        <div class="controls"><input type="text" id="video-url" aria-label="YouTube URL 或 Video ID" placeholder="YouTube URL 或 Video ID"><button type="button" id="add-video">加入網址</button></div>
        <h2>影片庫</h2><div id="custom-library" class="card-grid"></div>
      </div>
      <aside class="selection-panel">
        <h2>已選 <span id="selected-count">0</span> 個影片</h2>
        <ol id="selected-videos" class="selection-list"></ol>
        <label>版面 <select id="layout-select"><option value="auto">自動</option><option value="equal">平均排列</option><option value="primary">主視角</option></select></label>
        <label>主要聲音 <select id="audio-select"></select></label>
        <label>觀看版型 <select id="ptt-select"><option value="live">影片＋即時 PTT 專串</option><option value="video">純影片</option></select></label>
        <button type="button" id="start-viewing" class="primary">開始觀看</button>
      </aside>
    </div>
  </section>
  <section class="page" id="session" hidden>
    <div class="section-head"><h2>自訂觀看</h2><button type="button" id="back-builder">返回選擇</button></div>
    <div class="controls" id="session-controls">
      <label>主視角 <select id="session-primary"></select></label>
      <label>主要聲音 <select id="session-audio"></select></label>
      <label>版面 <select id="session-layout"><option value="auto">自動</option><option value="equal">平均排列</option><option value="primary">主視角</option></select></label>
    </div>
    <p id="session-notice" role="status"></p>
  </section>
  <section class="page" id="ptt" hidden><p class="unavailable">PTT 正式唯讀契約仍由 Issue #48 確認；目前不顯示虛構資料。</p></section>
  <section class="page" id="watchalong" hidden><p class="unavailable">Watchalong 歷史片源、時間對齊與已完成字幕尚待正式資料契約接入。</p></section>
  <section class="page" id="collab" hidden><p class="unavailable">Collab 需要可驗證的同場活動識別，不會僅憑時間推論。</p></section>
  <div id="error-message" role="alert" hidden></div>
</main>
<!-- Permanent container: never inside a route section that is remounted. -->
<div id="permanent-players" class="permanent-players" hidden aria-label="YouTube 播放器"></div>
<script type="module" src="../shell_app.mjs"></script>
</body>
</html>
